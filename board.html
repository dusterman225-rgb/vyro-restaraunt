<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Order status - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Order status</div>
  </div>
  <div class="note" style="text-align:center">Leave this open on a screen at the counter. Customers watch for their number.</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div class="card" style="flex:1;min-width:150px"><h2>Preparing</h2><div id="prep" style="display:flex;flex-wrap:wrap;gap:10px"></div></div>
    <div class="card" style="flex:1;min-width:150px"><h2 style="color:#7fe3b0">READY</h2><div id="ready" style="display:flex;flex-wrap:wrap;gap:10px"></div></div>
  </div>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant' && !(ctx.biz.apps && ctx.biz.apps.restaurant)) { location.replace('https://vyrocontractor.dusterman225.workers.dev/app.html'); return false; } vtheme.load(ctx); return true; }
  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    if (ctx.role === 'kiosk') { $('err').textContent = 'Use a staff login for this screen.'; return; }
    try { var wl = await navigator.wakeLock.request('screen'); } catch (e) {}
    ctx.bizRef.collection('orders').where('dateKey', '==', vutil.todayStr()).onSnapshot(function (s) {
      var prep = $('prep'), rd = $('ready'); prep.textContent = ''; rd.textContent = '';
      var list = s.docs.map(function (d) { return d.data(); }).filter(function (o) { return o.status !== 'Voided' && o.kitchenStatus && o.kitchenStatus !== 'Hold' && o.kitchenStatus !== 'Served' && !o.tableName; }).sort(function (a, b) { return (a.clientAt || 0) - (b.clientAt || 0); });
      list.forEach(function (o) { var b = vyro.el('b', '', o.number || ''); b.style.cssText = 'font-size:2rem;padding:8px 14px;border-radius:12px;border:2px solid ' + (o.kitchenStatus === 'Ready' ? '#7fe3b0' : '#ffb25c'); (o.kitchenStatus === 'Ready' ? rd : prep).appendChild(b); });
    }, function (e) { $('err').textContent = vyro.friendly(e); });
  });
</script>
</body>
</html>
