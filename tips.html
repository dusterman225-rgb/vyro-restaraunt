<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Tips - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Tips</div>
  </div>
  <div class="card" style="margin-top:0">
    <label class="field"><span>From</span><input id="from" type="date"></label>
    <label class="field"><span>To</span><input id="to" type="date"></label>
    <div class="strip"><div><small>Tips</small><b id="kT">-</b></div><div><small>Orders</small><b id="kO">-</b></div><div><small>Average</small><b id="kA">-</b></div></div>
  </div>
  <div class="card"><h2>By person</h2><div id="by"></div><div class="note" id="e"></div></div>
  <div class="card"><h2>By day</h2><div id="days"></div></div>
  <div class="card"><button class="btn ghost" id="csv" type="button">Download as a spreadsheet (CSV)</button></div>
  <div class="note" style="font-size:.78rem;text-align:left">Tips are credited to the person who placed the order. Vyro only records tips. Paying them out is up to you.</div>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant' && !(ctx.biz.apps && ctx.biz.apps.restaurant)) { location.replace('https://vyrocontractor.dusterman225.workers.dev/app.html'); return false; } vtheme.load(ctx); return true; }
  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    var all = vroles.isStaff(ctx);
    function dk(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    var d = new Date(); $('to').value = dk(d); d.setDate(d.getDate() - 6); $('from').value = dk(d);
    var rows = [];
    function line(a, b, c) { var r = vyro.el('div', 'row'); r.appendChild(vyro.el('span', '', a)); r.appendChild(vyro.el('b', '', b)); if (c) r.appendChild(vyro.el('small', '', c)); return r; }
    async function load() {
      $('by').textContent = ''; $('days').textContent = '';
      try {
        var q = ctx.bizRef.collection('orders'); q = all ? q.where('dateKey', '>=', $('from').value) : q.where('byUid', '==', ctx.user.uid);
        var s = await q.get(); rows = s.docs.map(function (z) { return z.data(); }).filter(function (o) { return o.status === 'Paid' && o.dateKey >= $('from').value && o.dateKey <= $('to').value; });
      } catch (e) { $('err').textContent = vyro.friendly(e); }
      var by = {}, day = {}, tot = 0, n = 0;
      rows.forEach(function (o) { var t = o.tipCents || 0; tot += t; n++; var k = o.byName || 'Unknown'; by[k] = by[k] || { t: 0, n: 0 }; by[k].t += t; by[k].n++; day[o.dateKey] = (day[o.dateKey] || 0) + t; });
      Object.keys(by).sort(function (a, b) { return by[b].t - by[a].t; }).forEach(function (k) { $('by').appendChild(line(k, vutil.fmt(by[k].t), by[k].n + ' orders')); });
      Object.keys(day).sort().forEach(function (k) { $('days').appendChild(line(k, vutil.fmt(day[k]))); });
      $('kT').textContent = vutil.fmt(tot); $('kO').textContent = n; $('kA').textContent = n ? vutil.fmt(Math.round(tot / n)) : '-'; $('e').textContent = n ? '' : 'No paid orders in this period.';
    }
    $('from').addEventListener('change', load); $('to').addEventListener('change', load);
    $('csv').addEventListener('click', function () {
      function q(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
      var out = ['Date,Server,Order,Total,Tip']; rows.forEach(function (o) { out.push([o.dateKey, o.byName, o.number, (o.totalCents || 0) / 100, (o.tipCents || 0) / 100].map(q).join(',')); });
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out.join('\n')], { type: 'text/csv' })); a.download = 'tips.csv'; document.body.appendChild(a); a.click(); a.remove();
    });
    load();
  });
</script>
</body>
</html>
