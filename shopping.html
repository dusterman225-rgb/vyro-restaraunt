<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Shopping list - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Shopping list</div>
  </div>
  <div class="card" style="margin-top:0"><div class="note" style="text-align:left">Everything at or below its "low" level, grouped by vendor. Set the vendor and low level on each item in Ingredient supply. The suggested amount brings an item back to double its low level.</div>
  <div id="groups"></div><div class="note" id="e"></div></div>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant' && !(ctx.biz.apps && ctx.biz.apps.restaurant)) { location.replace('https://vyrocontractor.dusterman225.workers.dev/app.html'); return false; } vtheme.load(ctx); return true; }
  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    if (ctx.role === 'kiosk' || ctx.role === 'host') { $('err').textContent = 'The shopping list is for cooks, servers and managers.'; return; }
    var rows = [];
    try { var s = await ctx.bizRef.collection('supply').get(); rows = s.docs.map(function (d) { return d.data(); }); } catch (e) { $('err').textContent = vyro.friendly(e); }
    var low = rows.filter(function (r) { return (r.onHand || 0) <= (r.lowAt || 0); }), g = {};
    low.forEach(function (r) { var v = r.vendor || 'No vendor set'; (g[v] = g[v] || []).push(r); });
    var box = $('groups'); box.textContent = '';
    Object.keys(g).sort().forEach(function (v) {
      var c = vyro.el('div', 'card'); c.appendChild(vyro.el('h2', '', v)); var lines = [];
      g[v].sort(function (a, b) { return String(a.name).localeCompare(b.name); }).forEach(function (r) {
        var need = Math.max(1, Math.ceil((r.lowAt || 1) * 2 - (r.onHand || 0))), txt = need + ' ' + (r.unit || '') + ' ' + r.name; lines.push(txt.replace(/  +/g, ' '));
        var row = vyro.el('div', 'item'), l = vyro.el('div', 'grow'); l.appendChild(vyro.el('b', '', r.name)); l.appendChild(vyro.el('small', '', 'On hand ' + (r.onHand || 0) + ' ' + (r.unit || '') + ' \u00b7 order about ' + need)); row.appendChild(l); c.appendChild(row);
      });
      var text = 'Order for ' + (ctx.biz.name || 'the restaurant') + ':\n' + lines.join('\n');
      var a = vyro.el('a', 'btn', 'Text this list'); a.href = 'sms:?&body=' + encodeURIComponent(text); c.appendChild(a);
      var m = vyro.el('a', 'btn ghost', 'Email this list'); m.href = 'mailto:?subject=' + encodeURIComponent('Order for ' + (ctx.biz.name || '')) + '&body=' + encodeURIComponent(text); c.appendChild(m);
      var cp = vyro.el('button', 'btn ghost', 'Copy'); cp.type = 'button'; cp.addEventListener('click', function () { try { navigator.clipboard.writeText(text); cp.textContent = 'Copied'; } catch (e) { cp.textContent = 'Could not copy'; } }); c.appendChild(cp);
      box.appendChild(c);
    });
    $('e').textContent = low.length ? '' : 'Nothing is low right now.';
  });
</script>
</body>
</html>
