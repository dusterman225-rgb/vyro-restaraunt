<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Schedule - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<style>
.wk{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.dcol{flex:0 0 172px;scroll-snap-align:start;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px;background:rgba(255,255,255,.02)}
.dcol.today{border-color:#4B9CD3;box-shadow:0 0 0 1px #4B9CD3}
.dcol h3{margin:0 0 6px;font-size:.9rem;text-align:center}.dcol h3 small{display:block;font-weight:400;opacity:.7}
.shift{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px;margin-bottom:6px;font-size:.85rem}
.shift b{display:block}.shift small{display:block;opacity:.8;margin-top:2px}
.shift .btn{width:100%;margin:6px 0 0;padding:8px 6px;font-size:.78rem;letter-spacing:0}
.shift.swap{border-color:#ffb25c}.shift.mine{background:rgba(75,156,211,.12)}
.pend .item{flex-wrap:wrap}
</style>
<script>window.VYRO_NO_WORKCHECK = true;</script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Schedule</div>
  </div>
  <div class="card" style="margin-top:0">
    <div class="row" style="gap:8px;border:0"><button class="btn ghost" id="prev" type="button" style="margin:0">&lsaquo; Week</button><b id="wk" style="flex:1;text-align:center"></b><button class="btn ghost" id="next" type="button" style="margin:0">Week &rsaquo;</button></div>
    <div class="tabs" id="flt"><button type="button" class="on" data-f="all">Everyone</button><button type="button" data-f="mine">My shifts</button></div>
  </div>
  <div class="card" id="pendCard" style="display:none"><h2 style="margin:0 0 4px">Swap requests</h2><div class="note" id="pendNote"></div><div class="pend" id="pend"></div></div>
  <div class="note" id="slide" style="text-align:center">Slide sideways to see the whole week.</div>
  <div class="wk" id="days"></div>
  <details class="sec" id="addSec" style="display:none"><summary>Add a shift</summary><div class="in">
    <label class="field"><span>Who</span><select id="who"></select></label>
    <label class="field"><span>Day</span><input id="date" type="date"></label>
    <label class="field"><span>Start</span><input id="st" type="time" value="09:00"></label>
    <label class="field"><span>End</span><input id="en" type="time" value="17:00"></label>
    <label class="field"><span>Note (optional)</span><input id="note" maxlength="60" placeholder="e.g. opening, patio"></label>
    <button class="btn" id="add" type="button">Add shift</button><div class="note" id="msg"></div>
  </div></details>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script src="js/vcache.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant' && !(ctx.biz.apps && ctx.biz.apps.restaurant)) { location.replace('https://vyrocontractor.dusterman225.workers.dev/app.html'); return false; } vtheme.load(ctx); return true; }
  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    if (ctx.role === 'kiosk') { $('err').textContent = 'Not available on the kiosk login.'; return; }
    var col = ctx.bizRef.collection('schedule'), edit = vroles.can(ctx, 'timekeeping'), rows = [], members = [], mine = false, unsub = null, start = mondayOf(new Date());
    function mondayOf(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
    function dk(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function t12(t) { var p = String(t || '').split(':'), h = parseInt(p[0], 10); return (h % 12 || 12) + (p[1] && p[1] !== '00' ? ':' + p[1] : '') + (h < 12 ? 'a' : 'p'); }
    if (edit) {
      $('addSec').style.display = 'block';
      try { var ms = await vcache.get(ctx, 'members'); ms.forEach(function (d) { var m = d.data(); m.id = d.id; if (m.role !== 'kiosk') members.push(m); }); } catch (e) {}
      members.sort(function (a, b) { return vyro.nameOf(a).localeCompare(vyro.nameOf(b)); });
      members.forEach(function (m) { var o = document.createElement('option'); o.value = m.id; o.textContent = vyro.nameOf(m); $('who').appendChild(o); });
    }
    function load() {
      if (unsub) unsub(); var end = new Date(start); end.setDate(end.getDate() + 6);
      $('wk').textContent = start.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' - ' + end.toLocaleDateString([], { month: 'short', day: 'numeric' });
      unsub = col.where('date', '>=', dk(start)).onSnapshot(function (s) { rows = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; }).filter(function (x) { return x.date <= dk(end); }); draw(); }, function (e) { $('err').textContent = vyro.friendly(e); });
    }
    var me = ctx.user.uid, myTitle = (ctx.me && ctx.me.title) || ctx.role, today = dk(new Date());
    function err(e) { $('err').textContent = vyro.friendly(e); }
    function nice(x) { var p = x.date.split('-'); return new Date(+p[0], p[1] - 1, +p[2]).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' + t12(x.start) + '-' + t12(x.end); }
    // tells people about a swap: to = 'mgmt' (every manager) or one person's id
    function tell(to, text, schedId) { return ctx.bizRef.collection('notifications').add({ to: to, text: String(text).slice(0, 200), kind: 'swap', schedId: schedId || '', byUid: me, byName: vyro.who(ctx), done: false, createdAt: vyro.stamp() }).catch(function () {}); }
    async function closeMgmtNotes(id) { try { var q = await ctx.bizRef.collection('notifications').where('to', '==', 'mgmt').where('schedId', '==', id).get(); q.forEach(function (d) { d.ref.update({ done: true, updatedAt: vyro.stamp() }).catch(function () {}); }); } catch (e) {} }
    function btn(label, cls, fn) { var b = vyro.el('button', 'btn ' + (cls || 'ghost'), label); b.type = 'button'; b.addEventListener('click', async function () { b.disabled = true; try { await fn(); } catch (e) { err(e); } b.disabled = false; }); return b; }

    async function requestSwap(x) {
      var n = prompt('Reason or note for your manager (optional)'); if (n === null) return;
      await col.doc(x.id).update({ swapReq: true, swapStatus: 'requested', swapNote: n.slice(0, 80), swapTitle: myTitle, offerUid: '', offerName: '', swapDecision: '', updatedAt: vyro.stamp() });
      await tell('mgmt', vyro.who(ctx) + ' (' + myTitle + ') asked to swap ' + nice(x) + (n ? ': ' + n.slice(0, 80) : ''), x.id);
    }
    async function cancelSwap(x) {
      await col.doc(x.id).update({ swapReq: false, swapStatus: '', swapNote: '', offerUid: '', offerName: '', updatedAt: vyro.stamp() });
      await closeMgmtNotes(x.id);
      if (x.offerUid) await tell(x.offerUid, vyro.who(ctx) + ' cancelled the swap for ' + nice(x), x.id);
    }
    async function offer(x) {
      if (!confirm('Offer to work ' + x.name + "'s shift on " + nice(x) + '? A manager has to approve it.')) return;
      await col.doc(x.id).update({ offerUid: me, offerName: vyro.who(ctx), swapStatus: 'offered', updatedAt: vyro.stamp() });
      await tell('mgmt', vyro.who(ctx) + ' offered to cover ' + x.name + ' on ' + nice(x) + '. Needs your approval.', x.id);
      await tell(x.uid, vyro.who(ctx) + ' offered to cover your shift on ' + nice(x) + '. A manager will decide.', x.id);
    }
    async function withdraw(x) { await col.doc(x.id).update({ offerUid: '', offerName: '', swapStatus: 'requested', updatedAt: vyro.stamp() }); }
    async function decide(x, yes) {
      var r = prompt((yes ? 'Approve' : 'Reject') + ' this swap.\nReason (optional, leave blank for none). Cancel to go back:'); if (r === null) return; r = r.trim().slice(0, 100);
      var why = r ? ' Reason: ' + r : '';
      if (yes) {
        if (!x.offerUid) { alert('Nobody has offered yet. Use "Give to..." to pick someone.'); return; }
        await col.doc(x.id).update({ uid: x.offerUid, name: x.offerName, swapReq: false, swapStatus: '', swapNote: '', offerUid: '', offerName: '', swapDecision: '', updatedAt: vyro.stamp() });
        await tell(x.uid, 'Your swap for ' + nice(x) + ' was APPROVED. ' + x.offerName + ' will work it.' + why, x.id);
        await tell(x.offerUid, 'You are now working ' + nice(x) + '. Swap APPROVED.' + why, x.id);
      } else {
        await col.doc(x.id).update({ swapReq: false, swapStatus: 'rejected', swapDecision: r, offerUid: '', offerName: '', updatedAt: vyro.stamp() });
        await tell(x.uid, 'Your swap for ' + nice(x) + ' was REJECTED.' + why, x.id);
        if (x.offerUid) await tell(x.offerUid, 'Your offer to cover ' + nice(x) + ' was REJECTED.' + why, x.id);
      }
      await closeMgmtNotes(x.id);
    }
    function giveTo(x) {
      var same = members.filter(function (m) { return m.id !== x.uid && (m.title || m.role) === x.swapTitle; }); if (!same.length) same = members.filter(function (m) { return m.id !== x.uid; });
      var names = same.map(function (m, i2) { return (i2 + 1) + ' ' + vyro.nameOf(m) + ' (' + (m.title || m.role) + ')'; }).join('\n');
      var a = parseInt(prompt('Give this shift to (type the number):\n' + names), 10), m = same[a - 1]; if (!m) return;
      return col.doc(x.id).update({ offerUid: m.id, offerName: vyro.nameOf(m), swapStatus: 'offered', updatedAt: vyro.stamp() }).then(function () { return tell(m.id, 'A manager asked you to cover ' + nice(x) + '.', x.id); });
    }
    function status(x) {
      if (x.swapReq) return 'SWAP REQUESTED' + (x.offerName ? ' · ' + x.offerName + ' offered' : ' · needs cover') + (x.swapNote ? ': ' + x.swapNote : '');
      if (x.swapStatus === 'rejected') return 'Swap rejected' + (x.swapDecision ? ': ' + x.swapDecision : '');
      return '';
    }
    function actions(x, c, full) {
      var own = x.uid === me, future = x.date >= today;
      if (own && future && !x.swapReq) c.appendChild(btn('Request swap', 'ghost', function () { return requestSwap(x); }));
      if (own && x.swapReq) c.appendChild(btn('Cancel swap request', 'ghost', function () { return cancelSwap(x); }));
      if (!own && x.swapReq && future && x.swapTitle && x.swapTitle === myTitle && !x.offerUid) c.appendChild(btn('Offer to cover', 'btn', function () { return offer(x); }));
      if (!own && x.swapReq && x.offerUid === me) c.appendChild(btn('Withdraw my offer', 'ghost', function () { return withdraw(x); }));
      if (edit && x.swapReq) {
        if (x.offerUid) { c.appendChild(btn('Approve', 'btn', function () { return decide(x, true); })); }
        else c.appendChild(btn('Give to...', 'btn', function () { return giveTo(x); }));
        c.appendChild(btn('Reject', 'ghost', function () { return decide(x, false); }));
      }
      if (edit && full) c.appendChild(btn('Delete', 'ghost', function () { if (confirm('Delete this shift?')) return col.doc(x.id).delete(); }));
    }
    function draw() {
      var box = $('days'); box.textContent = '';
      for (var i = 0; i < 7; i++) {
        var d = new Date(start); d.setDate(d.getDate() + i); var k = dk(d), list = rows.filter(function (x) { return x.date === k && (!mine || x.uid === me); }).sort(function (a, b) { return String(a.start).localeCompare(String(b.start)); });
        var c = vyro.el('div', 'dcol' + (k === today ? ' today' : '')), h = vyro.el('h3', '', d.toLocaleDateString([], { weekday: 'short' })); h.appendChild(vyro.el('small', '', d.toLocaleDateString([], { month: 'short', day: 'numeric' }))); c.appendChild(h);
        if (!list.length) c.appendChild(vyro.el('div', 'note', mine ? 'Off' : 'Nobody'));
        list.forEach(function (x) {
          var s = vyro.el('div', 'shift' + (x.uid === me ? ' mine' : '') + (x.swapReq ? ' swap' : ''));
          s.appendChild(vyro.el('b', '', x.name)); s.appendChild(vyro.el('span', '', t12(x.start) + ' - ' + t12(x.end)));
          if (x.note) s.appendChild(vyro.el('small', '', x.note)); var st = status(x); if (st) s.appendChild(vyro.el('small', '', st));
          actions(x, s, true); c.appendChild(s);
        });
        box.appendChild(c);
      }
      // managers: everything waiting for a decision
      var pend = rows.filter(function (x) { return x.swapReq && x.date >= today; }).sort(function (a, b) { return (a.date + a.start).localeCompare(b.date + b.start); });
      $('pendCard').style.display = edit && pend.length ? 'block' : 'none';
      if (edit) { $('pendNote').textContent = pend.length + ' waiting for you.'; var pb = $('pend'); pb.textContent = ''; pend.forEach(function (x) { var r = vyro.el('div', 'shift swap'); r.appendChild(vyro.el('b', '', x.name + ' (' + (x.swapTitle || '') + ')')); r.appendChild(vyro.el('span', '', nice(x))); r.appendChild(vyro.el('small', '', status(x))); actions(x, r, false); pb.appendChild(r); }); }
    }
    $('prev').addEventListener('click', function () { start.setDate(start.getDate() - 7); load(); }); $('next').addEventListener('click', function () { start.setDate(start.getDate() + 7); load(); });
    Array.prototype.forEach.call(document.querySelectorAll('#flt button'), function (b) { b.addEventListener('click', function () { mine = b.getAttribute('data-f') === 'mine'; Array.prototype.forEach.call(document.querySelectorAll('#flt button'), function (x) { x.classList.toggle('on', x === b); }); draw(); }); });
    $('date').value = dk(new Date());
    $('add').addEventListener('click', async function () {
      var m = members.filter(function (x) { return x.id === $('who').value; })[0]; if (!m || !$('date').value) { $('msg').textContent = 'Pick a person and a day.'; $('msg').className = 'note err'; return; }
      if ($('en').value <= $('st').value) { $('msg').textContent = 'End time must be after the start (for overnight, make two shifts).'; $('msg').className = 'note err'; return; }
      try { await col.add({ uid: m.id, name: vyro.nameOf(m), date: $('date').value, start: $('st').value, end: $('en').value, note: $('note').value.trim().slice(0, 60), swapReq: false, swapStatus: '', createdAt: vyro.stamp(), updatedAt: vyro.stamp() }); $('msg').textContent = 'Added.'; $('msg').className = 'note ok'; $('note').value = ''; } catch (e) { $('msg').textContent = vyro.friendly(e); $('msg').className = 'note err'; }
    });
    load();
  });
</script>
</body>
</html>
