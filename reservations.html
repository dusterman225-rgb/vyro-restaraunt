<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Reservations - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Reservations</div>
  </div>

  <div class="card" style="margin-top:0">
    <label class="field"><span>Day</span><input id="day" type="date"></label>
    <div id="list"></div>
    <div class="note" id="empty"></div>
  </div>
  <details class="sec" id="addSec" open>
    <summary>Add a reservation</summary>
    <div class="in">
      <label class="field"><span>Name</span><input id="name" maxlength="80"></label>
      <label class="field"><span>Phone (optional)</span><input id="phone" type="tel" maxlength="30"></label>
      <label class="field"><span>Party size</span><input id="size" type="number" inputmode="numeric" min="1" max="100"></label>
      <label class="field"><span>Date</span><input id="date" type="date"></label>
      <label class="field"><span>Time</span><input id="time" type="time"></label>
      <label class="field"><span>Notes (birthday, high chair...)</span><input id="notes" maxlength="200"></label>
      <button class="btn" id="save" type="button">Save reservation</button>
      <div class="note" id="msg"></div>
    </div>
  </details>
  <a class="btn ghost" href="tables.html">Tables</a>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>
<div class="modal-bg" id="bg"><div class="modal" id="box"></div></div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant') { location.replace('https://vyrocontractor.dusterman225.workers.dev/app.html'); return false; } vtheme.load(ctx); return true; }
  function deny(msg) { Array.prototype.forEach.call(document.querySelectorAll('.wrap > *'), function (n) { if (!n.classList.contains('brand') && !n.classList.contains('back') && n.id !== 'err') n.style.display = 'none'; }); $('err').textContent = msg || 'You do not have access to this page.'; }

  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    var R = vroles, role = ctx.role;
    if (!(R.isStaff(ctx) || role === 'host' || role === 'server')) { deny('Reservations are for hosts, servers and managers.'); return; }
    var edit = role === 'host' || R.can(ctx, 'reservations'), col = ctx.bizRef.collection('reservations'), tcol = ctx.bizRef.collection('tables'), rows = [], unsub = null;
    if (!edit) $('addSec').style.display = 'none';
    $('day').value = vutil.todayStr(); $('date').value = vutil.todayStr();
    $('day').addEventListener('change', load);
    function load() {
      if (unsub) unsub();
      unsub = col.where('date', '==', $('day').value).onSnapshot(function (s) {
        rows = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
        rows.sort(function (a, b) { return (a.time || '') < (b.time || '') ? -1 : 1; }); draw();
      }, function (e) { $('err').textContent = vyro.friendly(e); });
    }
    function setRes(r, d) { d.updatedAt = vyro.stamp(); return col.doc(r.id).update(d).catch(function (e) { $('err').textContent = vyro.friendly(e); }); }
    function seat(r) {
      tcol.get().then(function (s) {
        var b = $('box'); b.textContent = ''; b.appendChild(vyro.el('h2', '', 'Seat ' + r.name + ' (' + r.partySize + ')'));
        var open = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; }).filter(function (t) { return (t.status || 'Open') === 'Open' || (t.status === 'Reserved'); });
        open.sort(function (a, b2) { return (a.seats || 0) - (b2.seats || 0); });
        if (!open.length) b.appendChild(vyro.el('div', 'note', 'No open tables right now.'));
        open.forEach(function (t) {
          var x = vyro.el('button', (t.seats || 0) >= r.partySize ? 'btn' : 'btn ghost', t.name + ' \u00b7 ' + (t.seats || '?') + ' seats'); x.type = 'button';
          x.addEventListener('click', async function () {
            try { await tcol.doc(t.id).update({ status: 'Seated', party: r.name + ', ' + r.partySize, seatedAt: Date.now(), updatedAt: vyro.stamp() }); await setRes(r, { status: 'Seated', tableName: t.name }); $('bg').classList.remove('open'); } catch (e) { $('err').textContent = vyro.friendly(e); }
          }); b.appendChild(x);
        });
        var c = vyro.el('button', 'btn ghost', 'Close'); c.type = 'button'; c.addEventListener('click', function () { $('bg').classList.remove('open'); }); b.appendChild(c); $('bg').classList.add('open');
      }).catch(function (e) { $('err').textContent = vyro.friendly(e); });
    }
    $('bg').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });
    function draw() {
      var box = $('list'); box.textContent = ''; $('empty').textContent = rows.length ? '' : 'No reservations on this day.';
      rows.forEach(function (r) {
        var row = vyro.el('div', 'item'), left = vyro.el('div', 'grow'), top = vyro.el('b');
        top.appendChild(vyro.el('span', 'pill ' + (r.status === 'Booked' ? 'Sent' : r.status === 'Seated' ? 'Paid' : r.status === 'Completed' ? 'Paid' : 'Voided'), r.status));
        top.appendChild(document.createTextNode((r.time || '') + ' \u00b7 ' + r.name + ' \u00b7 ' + r.partySize)); left.appendChild(top);
        left.appendChild(vyro.el('small', '', [r.phone, r.tableName ? 'Table ' + r.tableName : '', r.notes].filter(Boolean).join(' \u00b7 ')));
        row.appendChild(left);
        if (edit) {
          function act(txt, fn, ghost) { var x = vyro.el('button', ghost ? 'btn ghost' : 'btn', txt); x.type = 'button'; x.style.marginTop = '0'; x.addEventListener('click', fn); row.appendChild(x); }
          if (r.status === 'Booked') { act('Seat', function () { seat(r); }); act('Cancel', function () { if (confirm('Cancel this reservation?')) setRes(r, { status: 'Cancelled' }); }, true); act('No-show', function () { setRes(r, { status: 'No-show' }); }, true); }
          if (r.status === 'Seated') act('Done', function () { setRes(r, { status: 'Completed' }); }, true);
        }
        box.appendChild(row);
      });
    }
    $('save').addEventListener('click', async function () {
      var n = $('name').value.trim(), sz = parseInt($('size').value, 10), dt = $('date').value, tm = $('time').value;
      if (!n || !(sz >= 1 && sz <= 100) || !dt || !tm) { $('msg').textContent = 'Fill in the name, party size, date and time.'; $('msg').className = 'note err'; return; }
      try { await col.add({ name: n, phone: $('phone').value.trim(), partySize: sz, date: dt, time: tm, notes: $('notes').value.trim(), status: 'Booked', tableName: '', createdBy: vyro.who(ctx), createdAt: vyro.stamp(), updatedAt: vyro.stamp() });
        $('msg').textContent = 'Saved.'; $('msg').className = 'note ok'; $('name').value = ''; $('phone').value = ''; $('size').value = ''; $('notes').value = ''; $('day').value = dt; load(); }
      catch (e) { $('msg').textContent = vyro.friendly(e); $('msg').className = 'note err'; }
    });
    load();
  });
</script>
</body>
</html>
