<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Kiosk - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<style>.tab{background:transparent;color:inherit}.tab.on{background:#4B9CD3;border-color:#4B9CD3;color:#05070A;font-weight:700}</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Order here</div>
  </div>

  <div id="shop">
    <div class="tabs" id="cats"></div>
    <div class="pos-grid" id="grid"></div>
    <div class="note" id="noMenu"></div>
    <div class="card" style="margin-top:8px">
      <div id="cart"></div>
      <div class="note" id="cartEmpty">Tap what you would like.</div>
      <label class="field"><span>Your name (optional)</span><input id="label" maxlength="30"></label>
      <div class="total-row"><span>Subtotal</span><b id="tSub">$0.00</b></div>
      <div class="total-row"><span id="taxLbl">Tax</span><b id="tTax">$0.00</b></div>
      <div class="total-row big"><span>Total</span><b id="tTot">$0.00</b></div>
      <button class="btn" id="place" type="button">Place my order</button>
      <button class="btn ghost" id="clear" type="button">Start over</button>
      <div class="note" id="msg"></div>
    </div>
    <div class="note">You pay at the counter. Your order goes to the kitchen after you pay.</div>
  </div>
  <div id="done" style="display:none;text-align:center">
    <div class="card">
      <h2>Your order number</h2>
      <div id="num" style="font-size:3.2rem;font-weight:800;letter-spacing:.08em;margin:10px 0"></div>
      <div id="doneTot" class="note"></div>
      <div id="vyroPay" style="display:none"><button class="btn" id="vyroBtn" type="button">Pay now with the Vyro app</button><div id="vyroBox"></div></div>
      <p id="cashierNote">Or go to the counter, tell the cashier this number and pay. After you pay, your order goes to the kitchen.</p>
      <button class="btn" id="again" type="button">New order</button>
    </div>
  </div>
  <div class="note err" id="err"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script src="js/vcache.js"></script>
<script src="js/mods.js"></script>
<script src="js/avail.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="js/chain-config.js"></script>
<script src="js/chain.js"></script>
<script src="js/vpay.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant' && !(ctx.biz.apps && ctx.biz.apps.restaurant)) { location.replace('https://vyrocontractor.dusterman225.workers.dev/app.html'); return false; } vtheme.load(ctx); return true; }
  function deny(msg) { Array.prototype.forEach.call(document.querySelectorAll('.wrap > *'), function (n) { if (!n.classList.contains('brand') && !n.classList.contains('back') && n.id !== 'err') n.style.display = 'none'; }); $('err').textContent = msg || 'You do not have access to this page.'; }

  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    if (!vroles.isStaff(ctx) && ctx.role !== 'kiosk') { deny('The kiosk is for the customer ordering tablet.'); return; }
    var menu = [], cart = {}, taxPct = 0, cat = '', resetTimer = null, byId = {};
    try {
      var ts = await ctx.bizRef.collection('settings').doc('pos').get(); if (ts.exists) taxPct = Number(ts.data().taxPct) || 0;
      var ms = await vcache.get(ctx, 'menu');
      menu = ms.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; }).filter(function (m) { return m.active !== false; });
      menu.sort(function (a, b) { return (a.name || '').toLowerCase() < (b.name || '').toLowerCase() ? -1 : 1; });
    } catch (e) { $('err').textContent = vyro.friendly(e); }
    menu.forEach(function (m) { byId[m.id] = m; });
    $('taxLbl').textContent = 'Tax' + (taxPct ? ' (' + taxPct + '%)' : '');
    function totals() { var sub = 0; Object.keys(cart).forEach(function (k) { sub += cart[k].priceCents * cart[k].qty; }); var tax = Math.round(sub * taxPct / 100); return { sub: sub, tax: tax, total: sub + tax }; }
    function add(id, n, mods) {
      mods = mods || []; var k = id + '|' + vmods.sig(mods), m = byId[id];
      var c = cart[k] || { id: id, key: k, name: m.name, priceCents: m.priceCents + vmods.add(mods), qty: 0, mods: mods, modText: vmods.text(mods) };
      c.qty += n; if (c.qty <= 0) delete cart[k]; else if (c.qty <= 20) cart[k] = c; drawCart();
    }
    function drawMenu() {
      var cats = []; menu.forEach(function (m) { var c = m.category || 'Menu'; if (cats.indexOf(c) < 0) cats.push(c); }); cats.sort();
      if (!cat || cats.indexOf(cat) < 0) cat = cats[0] || '';
      var tabs = $('cats'); tabs.textContent = ''; cats.forEach(function (c) { var b = vyro.el('button', c === cat ? 'tab on' : 'tab', c); b.type = 'button'; b.addEventListener('click', function () { cat = c; drawMenu(); }); tabs.appendChild(b); });
      var g = $('grid'); g.textContent = ''; $('noMenu').textContent = menu.length ? '' : 'The menu is empty.';
      menu.filter(function (m) { return (m.category || 'Menu') === cat; }).forEach(function (m) {
        var t = vyro.el('div', 'pos-item'); t.setAttribute('role', 'button'); t.tabIndex = 0; t.style.minHeight = '96px';
        t.appendChild(vyro.el('b', '', m.name)); t.appendChild(vyro.el('span', '', vutil.fmt(m.priceCents))); var nope = vavail.why(m, {}); if (nope) { t.style.opacity = '.4'; t.appendChild(vyro.el('span', '', nope)); } else t.addEventListener('click', function () { add(m.id, 1); }); g.appendChild(t);
      });
    }
    function drawCart() {
      var box = $('cart'); box.textContent = ''; var ids = Object.keys(cart); $('cartEmpty').style.display = ids.length ? 'none' : 'block';
      ids.forEach(function (k) {
        var c = cart[k], row = vyro.el('div', 'item'), left = vyro.el('div', 'grow'); left.appendChild(vyro.el('b', '', c.name));
        if (c.modText) { var mt = vyro.el('small', '', c.modText); mt.style.cssText = 'color:#ffb25c;display:block'; left.appendChild(mt); }
        var mi = byId[c.id]; if (mi && (mi.ingredients || []).length) { var vi = vyro.el('button', 'link', 'View ingredients (extra / no)'); vi.type = 'button'; vi.style.display = 'block'; vi.addEventListener('click', function () { vmods.open(mi, c.mods, function (mods) { add(c.id, -1, c.mods); add(c.id, 1, mods); }); }); left.appendChild(vi); }
        row.appendChild(left);
        var q = vyro.el('div', 'qty'), m = vyro.el('button', '', '\u2212'), p = vyro.el('button', '', '+'); m.type = p.type = 'button';
        m.addEventListener('click', function () { add(c.id, -1, c.mods); }); p.addEventListener('click', function () { add(c.id, 1, c.mods); }); q.appendChild(m); q.appendChild(vyro.el('b', '', String(c.qty))); q.appendChild(p); row.appendChild(q);
        row.appendChild(vyro.el('b', '', vutil.fmt(c.priceCents * c.qty))); box.appendChild(row);
      });
      var t = totals(); $('tSub').textContent = vutil.fmt(t.sub); $('tTax').textContent = vutil.fmt(t.tax); $('tTot').textContent = vutil.fmt(t.total);
    }
    function reset() { clearTimeout(resetTimer); cart = {}; $('label').value = ''; $('msg').textContent = ''; $('done').style.display = 'none'; $('shop').style.display = 'block'; drawCart(); }
    $('clear').addEventListener('click', reset); $('again').addEventListener('click', reset);
    $('place').addEventListener('click', async function () {
      var ids = Object.keys(cart); if (!ids.length) { $('msg').textContent = 'Tap something first.'; $('msg').className = 'note err'; return; }
      if (!navigator.onLine) { $('msg').textContent = 'The kiosk has no internet right now. Please see the cashier.'; $('msg').className = 'note err'; return; }
      this.disabled = true; var t = totals(), num = 'K' + String(Date.now() % 10000).padStart(4, '0');
      var d = { label: $('label').value.trim().slice(0, 30) || 'Kiosk', items: ids.map(function (k) { var c = cart[k]; return { menuId: c.id, name: c.name, qty: c.qty, priceCents: c.priceCents, round: 1, mods: c.mods || [], modText: c.modText || '' }; }),
        subtotalCents: t.sub, taxPct: taxPct, taxCents: t.tax, totalCents: t.total, status: 'Open', kitchenStatus: 'Hold', source: 'kiosk', number: num, dateKey: vutil.todayStr(),
        byUid: ctx.user.uid, byName: 'Kiosk', clientAt: Date.now(), createdAt: vyro.stamp(), updatedAt: vyro.stamp() };
      try {
        var oid = ctx.bizRef.collection('orders').doc().id;
        await Promise.race([ctx.bizRef.collection('orders').doc(oid).set(d), new Promise(function (_, rej) { setTimeout(function () { rej({ code: 'vyro/timeout' }); }, 10000); })]);
        $('num').textContent = num; $('doneTot').textContent = 'Total ' + vutil.fmt(t.total); $('shop').style.display = 'none'; $('done').style.display = 'block'; window.scrollTo(0, 0);
        resetTimer = setTimeout(reset, 60000);
        $('vyroPay').style.display = vrpay.enabled(ctx) ? 'block' : 'none'; $('vyroBox').textContent = ''; $('vyroBtn').style.display = 'block'; $('cashierNote').style.display = 'block';
        $('vyroBtn').onclick = function () {
          var btn = this; clearTimeout(resetTimer); resetTimer = setTimeout(reset, 300000);
          vrpay.pickCoin(ctx, async function (coin) {
            btn.disabled = true;
            try {
              var req = await vrpay.makeReq(ctx, coin, t.total); await ctx.bizRef.collection('orders').doc(oid).update({ payReq: req, updatedAt: vyro.stamp() });
              btn.style.display = 'none'; var box = $('vyroBox'); box.textContent = '';
              var q = document.createElement('div'); q.style.cssText = 'background:#fff;padding:8px;border-radius:12px;max-width:320px;margin:10px auto'; q.innerHTML = vrpay.qr(req, num, ctx) || ''; box.appendChild(q);
              if (req.net !== 'mainnet') box.appendChild(vyro.el('div', 'note', 'TEST MODE: no real money'));
              box.appendChild(vyro.el('div', 'note', 'Open the Vyro app and scan this code, or take a photo of it with the app. Pay ' + vrpay.coinText(req.amountBase, req.coin, req.decimals) + ' (' + vutil.fmt(req.usdCents) + '). Vyro adds a small 1% fee.'));
              var st = vyro.el('div', 'note', 'Waiting for your payment...'); box.appendChild(st); $('cashierNote').style.display = 'none';
              vrpay.watch(req, async function (f) {
                try { await ctx.bizRef.collection('orders').doc(oid).update({ status: 'Paid', kitchenStatus: 'New', method: 'Pay with Vyro', payments: [{ method: 'Pay with Vyro', amountCents: t.total }], tipCents: 0, changeCents: 0, paidAt: vyro.stamp(), paidBy: 'Kiosk (Vyro)', txSignature: f.signature, payCoin: req.coin, payNet: req.net, updatedAt: vyro.stamp() });
                  box.textContent = ''; box.appendChild(vyro.el('h2', '', 'Paid. Thank you!')); box.appendChild(vyro.el('div', 'note', 'Your order ' + num + ' is on its way to the kitchen.')); clearTimeout(resetTimer); resetTimer = setTimeout(reset, 15000);
                } catch (e) { st.textContent = 'We received your payment but could not send the order. Please show this number to the cashier: ' + num; st.className = 'note err'; }
              }, 5000);
            } catch (e) { btn.disabled = false; $('vyroBox').textContent = ''; $('vyroBox').appendChild(vyro.el('div', 'note err', e && e.code === 'vyro/no-price' ? 'Could not get the price right now. Please pay at the counter.' : 'Could not make the code. Please pay at the counter.')); }
          });
        };
      } catch (e) { $('msg').textContent = e && e.code === 'vyro/timeout' ? 'That took too long. Please check with the cashier before ordering again.' : vyro.friendly(e); $('msg').className = 'note err'; }
      this.disabled = false;
    });
    drawMenu(); drawCart();
  });
</script>
</body>
</html>
