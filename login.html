<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Sign in - VyroRestaurant</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Home"></a>
    <div class="tag" id="tag">Restaurant sign in</div>
  </div>
  <div id="brandBox" style="display:none;text-align:center;margin:8px 0 4px">
    <img id="brandLogo" alt="" style="max-height:72px;max-width:70%;display:none;margin:0 auto 8px">
    <h1 id="brandName" style="margin:0 0 4px"></h1><div class="note" id="brandTag"></div>
  </div>

  <form class="card" id="f">
    <h2 id="formHead">VyroRestaurant: owners and employees</h2>
    <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" inputmode="email" required></label>
    <label class="field"><span>Password</span><input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="go" type="submit">Sign in</button>
    <button class="link" id="forgot" type="button">Forgot your password?</button>
    <div class="note" id="msg"></div>
  </form>
  <a class="back" href="https://vyrocontractor.dusterman225.workers.dev/login.html">Contractor or customer? Sign in here</a>
  <a class="back" href="signup.html">New restaurant? Create an account</a>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script>
  vyro.redirectIfSignedIn();
  var brand = null;
  // A link like login.html?r=hellskitchen shows that restaurant's name and colours. It is still the same sign in.
  (async function () {
    var r = (new URLSearchParams(location.search).get('r') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!r) return;
    try {
      var d = await vyro.db.collection('publicBrands').doc(r).get();
      if (!d.exists) { $('msg').textContent = 'That sign-in link was not found. You can still sign in below.'; return; }
      brand = d.data(); brand.slug = r;
      $('brandName').textContent = brand.name; $('brandTag').textContent = brand.tagline || ''; $('brandBox').style.display = 'block';
      $('formHead').textContent = 'Sign in to ' + brand.name; $('tag').textContent = brand.name;
      document.title = 'Sign in - ' + brand.name;
      if (/^https:\/\//.test(brand.logoUrl || '')) { $('brandLogo').src = brand.logoUrl; $('brandLogo').style.display = 'block'; }
      if (brand.accent && brand.bg && brand.text && window.vtheme) { try { vtheme.apply({ accent: brand.accent, bg: brand.bg, text: brand.text }); } catch (e) {} }
    } catch (e) { /* the normal sign in still works */ }
  })();
  var $ = function (id) { return document.getElementById(id); };
  function say(t, c) { $('msg').textContent = t; $('msg').className = 'note ' + (c || ''); }
  $('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var em = $('email').value.trim(), pw = $('pw').value;
    if (!em || !pw) { say('Enter your email and password.', 'err'); return; }
    $('go').disabled = true; say('Signing in...');
    try {
      var u = await vyro.signInAs('restaurant', em, pw);
      if (brand && brand.bizId) {
        try { var ud = await vyro.db.collection('users').doc(u.uid).get(), dd = ud.data() || {};
          if ((dd.bizIds || []).indexOf(brand.bizId) >= 0 && dd.bizId !== brand.bizId) { await vyro.db.collection('users').doc(u.uid).set({ bizId: brand.bizId }, { merge: true }); } } catch (e2) { /* keep their current workplace */ }
      }
      location.href = 'index.html';
    }
    catch (err) { say(err && err.msg ? err.msg : vyro.friendly(err), 'err'); $('go').disabled = false; }
  });
  $('forgot').addEventListener('click', async function () {
    var em = $('email').value.trim();
    if (!em) { say('Type your email above first.', 'err'); return; }
    try { await vyro.resetPassword(em); } catch (err) { /* keep the message neutral */ }
    say('If that email has an account, a reset link is on its way. Check spam too.');
  });
</script>
</body>
</html>
