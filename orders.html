<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Orders - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Orders</div>
  </div>

  <div class="strip">
    <div><small>Orders</small><b id="sN">-</b></div>
    <div><small>Open</small><b id="sOpen">-</b></div>
    <div><small>Paid total</small><b id="sPaid">-</b></div>
  </div>
  <div class="card" style="margin-top:0">
    <label class="field"><span>Day</span><input id="day" type="date"></label>
    <div id="list"></div>
    <div class="note" id="empty"></div>
  </div>
  <div class="card" id="byMethod" style="display:none"></div>
  <a class="btn" href="pos.html">New order</a>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant') { location.replace('https://vyrocontractor.dusterman225.workers.dev/app.html'); return false; } vtheme.load(ctx); return true; }

  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    var staff = ctx.role === 'owner' || ctx.role === 'supervisor', col = ctx.bizRef.collection('orders'), rows = [];
    if (!staff) { document.querySelector('.strip div:last-child').style.display = 'none'; document.querySelector('.strip').style.gridTemplateColumns = 'repeat(2,1fr)'; }
    $('day').value = vutil.todayStr();
    $('day').addEventListener('change', load);
    var unsub = null;
    function load() {
      if (unsub) { unsub(); unsub = null; }
      unsub = col.where('dateKey', '==', $('day').value).onSnapshot(function (s) {
        rows = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
        rows.sort(function (a, b) { return (a.number || '') < (b.number || '') ? 1 : -1; });
        draw();
      }, function (e) { $('err').textContent = vyro.friendly(e); rows = []; draw(); });
    }
    function draw() {
      var box = $('list'); box.textContent = ''; var open = 0, paid = 0, tips = 0, n = 0, by = {};
      rows.forEach(function (o) {
        if (o.status !== 'Voided') n++; if (o.status === 'Open') open++;
        if (o.status === 'Paid') { paid += o.totalCents || 0; tips += o.tipCents || 0; (o.payments || [{ method: o.method || 'Other', amountCents: o.totalCents }]).forEach(function (p) { by[p.method || 'Other'] = (by[p.method || 'Other'] || 0) + (p.amountCents || 0); }); }
        var row = vyro.el('div', 'item'), left = vyro.el('div', 'grow');
        var top = vyro.el('b'); top.appendChild(vyro.el('span', 'pill ' + o.status, o.status)); top.appendChild(document.createTextNode((o.number || '') + (o.label ? ' \u00b7 ' + o.label : '')));
        left.appendChild(top);
        left.appendChild(vyro.el('small', '', (o.items || []).map(function (i) { return i.qty + ' x ' + i.name; }).join(', ')));
        left.appendChild(vyro.el('small', '', [o.byName, o.status === 'Paid' ? o.method : '', o.tipCents ? 'tip ' + vutil.fmt(o.tipCents) : '', o.status !== 'Voided' ? (o.kitchenStatus === 'Hold' ? 'KIOSK - waiting for payment' : 'kitchen: ' + (o.kitchenStatus || 'New')) : ''].filter(Boolean).join(' \u00b7 ')));
        row.appendChild(left); row.appendChild(vyro.el('b', o.status === 'Voided' ? 'struck' : '', vutil.fmt(o.totalCents)));
        if (o.status === 'Open') { var a = vyro.el('a', 'btn', 'Open'); a.href = 'pos.html?order=' + o.id; a.style.marginTop = '0'; row.appendChild(a); }
        if (o.status === 'Paid') { var rc = vyro.el('a', 'btn ghost', 'Receipt'); rc.href = 'receipt.html?id=' + o.id; rc.style.marginTop = '0'; row.appendChild(rc); }
        if (vroles.can(ctx, 'void') && o.status !== 'Voided') {
          var v = vyro.el('button', 'btn ghost', 'Void'); v.type = 'button'; v.style.marginTop = '0';
          v.addEventListener('click', async function () {
            if (!confirm('Void order ' + (o.number || '') + '? It stays in the list but is not counted.')) return;
            try { await col.doc(o.id).update({ status: 'Voided', voidedBy: vyro.who(ctx), updatedAt: vyro.stamp() }); load(); } catch (e) { $('err').textContent = vyro.friendly(e); }
          });
          row.appendChild(v);
        }
        box.appendChild(row);
      });
      $('empty').textContent = rows.length ? '' : 'No orders on this day.';
      $('sN').textContent = n; $('sOpen').textContent = open; $('sPaid').textContent = vutil.fmt(paid);
      var bm = $('byMethod'); bm.textContent = '';
      if (staff && Object.keys(by).length) { bm.style.display = 'block'; bm.appendChild(vyro.el('h2', '', 'Collected by method (includes tips)')); if (tips) { var tr = vyro.el('div', 'row'); tr.appendChild(vyro.el('span', '', 'Tips today (to pay out)')); tr.appendChild(vyro.el('b', '', vutil.fmt(tips))); bm.appendChild(tr); } Object.keys(by).forEach(function (k) { var r = vyro.el('div', 'row'); r.appendChild(vyro.el('span', '', k)); r.appendChild(vyro.el('b', '', vutil.fmt(by[k]))); bm.appendChild(r); }); } else bm.style.display = 'none';
    }
    load();
  });
</script>
</body>
</html>
