<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Finances - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Finances</div>
  </div>

  <div class="card" style="margin-top:0">
    <label class="field"><span>Show</span><select id="range"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 12 months</option></select></label>
  </div>
  <div class="strip">
    <div><small>Sales</small><b id="fSales">-</b></div>
    <div><small>Orders</small><b id="fN">-</b></div>
    <div><small>Average</small><b id="fAvg">-</b></div>
  </div>
  <div class="strip">
    <div><small>Tax collected</small><b id="fTax">-</b></div>
    <div><small>Tips</small><b id="fTips">-</b></div>
    <div><small>Voided</small><b id="fVoid">-</b></div>
  </div>
  <div class="card"><h2>Collected by method</h2><div id="byM"></div></div>
  <div class="card"><h2>Best sellers</h2><div id="top"></div></div>
  <div class="card"><h2>By day</h2><div id="byD"></div></div>
  <div class="note">Sales are before tax and tips. Figures are only orders marked Paid in Vyro, so they match what your team recorded. This is not accounting or tax advice.</div>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant') { location.replace('https://vyrocontractor.dusterman225.workers.dev/app.html'); return false; } vtheme.load(ctx); return true; }
  function deny(msg) { Array.prototype.forEach.call(document.querySelectorAll('.wrap > *'), function (n) { if (!n.classList.contains('brand') && !n.classList.contains('back') && n.id !== 'err') n.style.display = 'none'; }); $('err').textContent = msg || 'You do not have access to this page.'; }

  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    if (!vroles.isOwnerLevel(ctx)) { deny('Finances are for the owner and general manager.'); return; }
    function dkey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function line(box, a, b) { var r = vyro.el('div', 'row'); r.appendChild(vyro.el('span', '', a)); r.appendChild(vyro.el('b', '', b)); box.appendChild(r); }
    async function load() {
      var days = parseInt($('range').value, 10), from = new Date(); from.setDate(from.getDate() - days + 1);
      var rows = [];
      try { var s = await ctx.bizRef.collection('orders').where('dateKey', '>=', dkey(from)).get(); rows = s.docs.map(function (d) { return d.data(); }); } catch (e) { $('err').textContent = vyro.friendly(e); }
      var sales = 0, tax = 0, tips = 0, n = 0, voids = 0, by = {}, items = {}, day = {};
      rows.forEach(function (o) {
        if (o.status === 'Voided') { voids++; return; } if (o.status !== 'Paid') return;
        n++; sales += o.subtotalCents || 0; tax += o.taxCents || 0; tips += o.tipCents || 0;
        (o.payments || [{ method: o.method || 'Other', amountCents: o.totalCents }]).forEach(function (p) { by[p.method] = (by[p.method] || 0) + (p.amountCents || 0); });
        (o.items || []).forEach(function (i) { var t = items[i.name] || (items[i.name] = { q: 0, c: 0 }); t.q += i.qty; t.c += i.qty * i.priceCents; });
        var d = day[o.dateKey] || (day[o.dateKey] = { n: 0, c: 0 }); d.n++; d.c += o.subtotalCents || 0;
      });
      $('fSales').textContent = vutil.fmt(sales); $('fN').textContent = n; $('fAvg').textContent = n ? vutil.fmt(Math.round(sales / n)) : '-';
      $('fTax').textContent = vutil.fmt(tax); $('fTips').textContent = vutil.fmt(tips); $('fVoid').textContent = voids;
      var m = $('byM'); m.textContent = ''; Object.keys(by).forEach(function (k) { line(m, k, vutil.fmt(by[k])); }); if (!Object.keys(by).length) m.appendChild(vyro.el('div', 'note', 'No paid orders yet.'));
      var t = $('top'); t.textContent = ''; Object.keys(items).sort(function (a, b) { return items[b].q - items[a].q; }).slice(0, 10).forEach(function (k) { line(t, items[k].q + ' x ' + k, vutil.fmt(items[k].c)); });
      var dd = $('byD'); dd.textContent = ''; Object.keys(day).sort().reverse().forEach(function (k) { line(dd, k + ' \u00b7 ' + day[k].n + ' orders', vutil.fmt(day[k].c)); });
    }
    $('range').addEventListener('change', load); load();
  });
</script>
</body>
</html>
