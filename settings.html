<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Settings - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Settings</div>
  </div>
  <div class="card" style="margin-top:0"><h2 style="margin:0 0 4px">Settings</h2><div class="note">Everything you set up once. Tap one to change it.</div><div id="list"></div></div>
  <div class="card"><button class="btn ghost" id="out" type="button">Sign out</button></div>
  
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script><script src="js/nav.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant' && !(ctx.biz.apps && ctx.biz.apps.restaurant)) { location.replace('https://vyrocontractor.dusterman225.workers.dev/app.html'); return false; } vtheme.load(ctx); return true; }
  $('out').addEventListener('click', async function () { await vyro.signOut(); location.href = 'login.html'; });
  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    var ids = ['service', 'menu', 'team', 'paysettings', 'worklocation', 'theme', 'profile', 'locations', 'records'];
    var list = vnav.items(ctx).filter(function (x) { return ids.indexOf(x.id) >= 0; });
    list.sort(function (a, b) { return ids.indexOf(a.id) - ids.indexOf(b.id); });
    var box = $('list');
    if (!list.length) { box.appendChild(vyro.el('div', 'note', 'Only the owner and managers can change settings.')); return; }
    list.forEach(function (x) { var a = vyro.el('a', 'vnav-row'); a.href = x.href; a.appendChild(vyro.el('b', '', x.label)); a.appendChild(vyro.el('small', '', x.desc)); box.appendChild(a); });
  });
</script>
</body>
</html>
